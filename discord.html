<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Discord Digests</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
:root{--bg:#0f1115;--card:#171a21;--fg:#e6e6e6;--mute:#8a93a5;--bull:#26a69a;--bear:#ef5350;--line:#2a2f3a;--acc:#5c8dff}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,Segoe UI,sans-serif}
main{max-width:1150px;margin:auto;padding:16px}
a{color:var(--acc)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:21px;margin:4px 0} h2{font-size:17px;margin:0 0 10px}
.sub{color:var(--mute);font-size:12px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:16px 0}
input,button,select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;cursor:pointer}
#lock{max-width:420px;margin:60px auto}
#lock form{display:flex;gap:8px;margin-top:12px} #lock input[type=password]{flex:1;min-width:0}
.err{color:var(--bear);font-size:13px;min-height:1.4em}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 0}
.tabs button{cursor:pointer;border-radius:16px;padding:6px 14px}
.tabs button.on{border-color:var(--acc);color:var(--acc)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
iframe{width:100%;border:0;border-radius:8px;background:#fff;min-height:400px}
.md table{border-collapse:collapse;font-size:13px;width:100%}
.md th,.md td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.md th{color:var(--mute);font-weight:500}
.md h1{font-size:19px} .md h2{font-size:16px;margin:18px 0 6px} .md h3{font-size:15px}
.wrap{overflow-x:auto}
.hidden{display:none}
</style></head><body><main>
<div class="top">
  <div><h1>Discord digests</h1><div class="sub" id="asof">Private. The Traders' Pub digests are encrypted; unlock with your passphrase (the same one as Finances).</div></div>
  <div><a href="/">Daily signals</a> · <a href="/brief">Market brief</a> · <a href="/x">Twitter analysis</a> <button id="relock" class="hidden" style="padding:4px 10px;font-size:13px">Lock</button></div>
</div>

<div id="lock"><section>
  <h2>Unlock</h2>
  <div class="sub">Decryption happens in this browser. The passphrase is never sent anywhere.</div>
  <form id="f"><input type="password" id="pw" placeholder="Passphrase" autocomplete="current-password" autofocus><button class="pri">Unlock</button></form>
  <label class="sub"><input type="checkbox" id="keep"> Keep unlocked in this tab</label>
  <div class="err" id="err"></div>
</section></div>

<div id="app" class="hidden">
  <div class="tabs" id="tabs">
    <button data-t="digest" class="on">Digests</button>
    <button data-t="northstar">Northstar portfolio</button>
    <button data-t="barissuzme">Barissuzme</button>
    <button data-t="serkan">Serkan</button>
    <button data-t="long_term">Long-term board</button>
    <button data-t="calls">Calls log</button>
  </div>
  <section id="p-digest">
    <div class="bar"><select id="pick" aria-label="Choose a digest"></select><span class="sub" id="dcount"></span>
      <input id="dq" placeholder="Filter by date" size="12" aria-label="Filter digests by date"></div>
    <div style="margin-top:12px"><iframe id="frame" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox" title="Digest"></iframe></div>
  </section>
  <section id="p-md" class="md hidden"><div id="mdbody"></div></section>
</div>
</main>
<script>
const $ = s => document.querySelector(s);
const RAW = 'https://raw.githubusercontent.com/berkeoz/new_trading/master/discord/';
const getBlob = f => fetch(RAW + f + '?t=' + Date.now()).then(r => r.ok ? r.json() : Promise.reject())
  .catch(() => fetch('discord/' + f).then(r => r.ok ? r.json() : Promise.reject(new Error('Data not found'))));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let KEY = null, KEYSALT = null, IDX = null;
async function keyFor(blob, pass) {
  if (KEY && KEYSALT === blob.salt) return KEY;
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  KEY = await crypto.subtle.deriveKey({name: 'PBKDF2', hash: 'SHA-256', salt: unb64(blob.salt), iterations: blob.iter}, base,
    {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  KEYSALT = blob.salt;
  return KEY;
}
let PASS = null;
async function dec(blob) {
  const k = await keyFor(blob, PASS);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: unb64(blob.iv)}, k, unb64(blob.ct)));
}
const md = t => DOMPurify.sanitize(marked.parse(t || '_Nothing yet._'));

async function showDigest(file) {
  const fr = $('#frame');
  fr.srcdoc = '<p style="font:14px system-ui;color:#555;padding:12px">Decrypting…</p>';
  try {
    const html = await dec(await getBlob(file));
    // the digest is our own email HTML; links open in a new tab, no scripts run (sandbox)
    fr.srcdoc = html.replace(/<a\s/gi, '<a target="_blank" rel="noopener" ');
    fr.onload = fit;
  } catch (e) { fr.srcdoc = '<p style="font:14px system-ui;color:#b00;padding:12px">Could not load this digest.</p>'; }
}
// size the frame to its content (only while visible; re-run on tab switch and resize)
function fit() {
  const fr = $('#frame');
  if (!fr.offsetWidth) return;
  try { fr.style.height = '0px'; fr.style.height = (fr.contentDocument.documentElement.scrollHeight + 20) + 'px'; } catch (e) {}
}
window.addEventListener('resize', () => { clearTimeout(fit.t); fit.t = setTimeout(fit, 150); });
function drawList() {
  const q = $('#dq').value.trim();
  const L = IDX.digests.filter(d => !q || d.when.includes(q) || (d.title || '').includes(q));
  $('#pick').innerHTML = L.map(d => `<option value="${d.file}">${d.when}${d.title ? ' · ' + d.title.replace(/[<&]/g, '') : ''}</option>`).join('');
  $('#dcount').textContent = `${L.length} of ${IDX.digests.length} digests`;
  if (L.length) showDigest(L[0].file);
}
function tab(t) {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t == t));
  $('#p-digest').classList.toggle('hidden', t != 'digest');
  $('#p-md').classList.toggle('hidden', t == 'digest');
  if (t == 'digest') fit();
  if (t != 'digest') {
    $('#mdbody').innerHTML = md(IDX.ledgers[t]);
    $('#mdbody').querySelectorAll('table').forEach(tb => { const w = document.createElement('div'); w.className = 'wrap'; tb.replaceWith(w); w.appendChild(tb); });
  }
  try { history.replaceState(null, '', '#' + t); } catch (e) {}
}

async function unlock(pass) {
  PASS = pass;
  const blob = await getBlob('index.enc.json');
  IDX = JSON.parse(await dec(blob));
  $('#lock').classList.add('hidden'); $('#app').classList.remove('hidden'); $('#relock').classList.remove('hidden');
  $('#asof').textContent = `Published ${IDX.built} · ${IDX.digests.length} digests · decrypted in this browser`;
  $('#pick').onchange = () => showDigest($('#pick').value);
  $('#dq').oninput = drawList;
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => tab(b.dataset.t));
  drawList();
  const h = location.hash.slice(1);
  if (h && IDX.ledgers[h] !== undefined) tab(h);
}
$('#f').onsubmit = async e => {
  e.preventDefault();
  $('#err').textContent = 'Unlocking…';
  try {
    await unlock($('#pw').value);
    $('#err').textContent = '';
    try { if ($('#keep').checked) sessionStorage.setItem('dc_pw', $('#pw').value); } catch {}
    $('#pw').value = '';
  } catch (err) { KEY = null; $('#err').textContent = err && err.message == 'Data not found' ? 'The encrypted data is not published yet.' : 'Wrong passphrase.'; }
};
$('#relock').onclick = () => { try { sessionStorage.removeItem('dc_pw'); } catch {} location.reload(); };
try { const s = sessionStorage.getItem('dc_pw'); if (s) unlock(s).catch(() => sessionStorage.removeItem('dc_pw')); } catch {}
</script><script src="/nav.js" defer></script></body></html>
