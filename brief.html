<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market Brief</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<style>
:root{--bg:#0f1115;--card:#171a21;--fg:#e6e6e6;--mute:#8a93a5;--bull:#26a69a;--bear:#ef5350;--neu:#f5b041;--line:#2a2f3a;--acc:#5c8dff}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,Segoe UI,sans-serif}
main{max-width:1100px;margin:auto;padding:16px}
a{color:var(--acc)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:21px;margin:4px 0}
.sub{color:var(--mute);font-size:12px}
select{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:16px 0}
#brief h1{font-size:20px} #brief h2{font-size:17px;margin:22px 0 6px;border-bottom:1px solid var(--line);padding-bottom:4px} #brief h3{font-size:15px;margin:16px 0 4px}
#brief table,.snap table{border-collapse:collapse;font-size:13px;width:100%;margin:6px 0}
#brief th,#brief td,.snap th,.snap td{border-bottom:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
#brief th,.snap th{color:var(--mute);font-weight:500}
#brief code{background:#232836;padding:1px 4px;border-radius:4px}
.wrap{overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}
.tk{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.tk h3{margin:0 0 4px;font-size:16px}
.pos{color:var(--bull)} .negv{color:var(--bear)}
.Bullish,.Turning.bullish{color:var(--bull)} .Bearish,.Turning.bearish{color:var(--bear)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;background:#232836;font-size:12px;margin-right:4px}
.lvl{font-size:13px;margin:2px 0}
.empty{color:var(--mute);padding:30px;text-align:center}
#macro h2{font-size:18px;margin:0 0 4px} #macro h3{font-size:15px;margin:16px 0 6px}
.regs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px;margin:8px 0}
.reg{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.reg b{display:block;font-size:12px;color:var(--mute);font-weight:500}
.pend{color:var(--neu);font-size:13px;margin:6px 0}
#outlook{border:1px solid var(--line);border-radius:8px;padding:4px 14px;margin:8px 0}
.mt td,.mt th{white-space:nowrap} .mt tr.ind{cursor:pointer} .mt tr.ind:hover{background:#1f2430}
.mt .det td{white-space:normal;background:#13161c}
.pill2{font-size:11px;padding:1px 6px;border-radius:8px;background:#232836;color:var(--mute)}
</style></head><body><main>
<div class="top">
  <div><h1>Market Brief</h1>
  <div class="sub">Written twice a day (9:15 and 15:45 ET) from market data, chart levels and news. Not investment advice.</div></div>
  <div><a href="/patterns">Chart formations</a> · <a href="/x">Twitter analysis</a> · <a href="/">Daily signals</a></div>
</div>
<p><select id="pick" aria-label="Choose a brief"></select></p>
<section id="brief"><div class="empty">Loading…</div></section>
<section class="snap" id="snap" hidden></section>
<section id="macro"><h2>Macro outlook</h2><div class="sub">Loading…</div></section>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sign = (v, u = '%') => v == null ? '–' : `<span class="${v > 0 ? 'pos' : v < 0 ? 'negv' : ''}">${v > 0 ? '+' : ''}${v}${u}</span>`;
const vcls = v => esc(v || '').split(',')[0];

// Briefs are read from GitHub, so publishing a brief does not need a new Vercel deployment.
const RAW = 'https://raw.githubusercontent.com/berkeoz/new_trading/master/briefs/';
const get = (f, kind) => fetch(RAW + f).then(r => r.ok ? r : Promise.reject())
  .catch(() => fetch('briefs/' + f)).then(r => r.ok ? r[kind]() : (kind == 'json' ? null : ''));

async function load(id) {
  $('#brief').innerHTML = '<div class="empty">Loading…</div>';
  const [md, js] = await Promise.all([
    get(`${id}.md`, 'text'),
    get(`${id}.json`, 'json')]);
  $('#brief').innerHTML = md ? DOMPurify.sanitize(marked.parse(md)) : '<div class="empty">Brief text not found.</div>';
  $('#brief').querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className = 'wrap'; t.replaceWith(w); w.appendChild(t); });
  $('#brief').querySelectorAll('a').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  renderSnap(js);
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
}

function renderSnap(d) {
  const el = $('#snap');
  if (!d) { el.hidden = true; return; }
  el.hidden = false;
  const P = [['1d', '1 day'], ['5d', '5 days'], ['1m', '1 month'], ['3m', '3 months'], ['6m', '6 months'], ['1y', '1 year']];
  const ctx = d.context.map(c => c.error ? `<tr><td>${esc(c.label)}</td><td colspan="${P.length + 2}" class="sub">n/a</td></tr>` :
    `<tr><td>${esc(c.label)}</td><td class="sub">${esc(c.group)}</td><td>${c.last}${c.kind == 'yield' ? '%' : ''}</td>
     ${P.map(([k]) => `<td>${sign(c['chg_' + k] ?? null, c.unit)}</td>`).join('')}</tr>`).join('');
  // sectors: sortable by any period; "vs SPY" shows over/under-performance in percentage points
  const secs = d.sectors || [];
  const secRows = key => secs.slice().sort((a, b) => (b[key] ?? -1e9) - (a[key] ?? -1e9)).map(c => c.error
    ? `<tr><td>${esc(c.label)}</td><td colspan="${P.length + 1}" class="sub">n/a</td></tr>`
    : `<tr><td>${esc(c.label)} <span class="sub">${esc(c.symbol)}</span></td><td>${c.last}</td>${P.map(([k]) =>
        `<td>${sign(c['chg_' + k] ?? null)}<div class="sub">${c['vs_spy_' + k] == null ? '' : (c['vs_spy_' + k] > 0 ? '+' : '') + c['vs_spy_' + k]}</div></td>`).join('')}</tr>`).join('');
  const tk = d.tickers.map(t => {
    if (t.error) return `<div class="tk"><h3>${esc(t.symbol)}</h3><div class="sub">${esc(t.error)}</div></div>`;
    const dd = t.daily, h4 = t.h4 || {};
    const lv = (arr, cls) => arr.map(x => `<div class="lvl"><b class="${cls}">${x.price}</b> <span class="sub">${sign(x.distance_pct)}</span> ${esc(x.what)}</div>`).join('') || '<div class="sub">none within 12%</div>';
    return `<div class="tk"><h3>${esc(t.symbol)} <span class="sub">${t.last_close} (${esc(t.last_close_date)}) ${sign(t.change_1d_pct)} · 5d ${sign(t.change_5d_pct)} · 1m ${sign(t.change_1m_pct)}</span></h3>
      ${t.live ? `<div class="sub">latest ${t.live.price} at ${esc(t.live.time_et)} ET</div>` : ''}
      <div><span class="pill">Daily <b class="${vcls(dd.verdict)}">${esc(dd.verdict)}</b> ${dd.score}</span>
           <span class="pill">4H <b class="${vcls(h4.verdict)}">${esc(h4.verdict || '–')}</b> ${h4.score ?? ''}</span></div>
      <div class="sub" style="margin:4px 0">RSI ${dd.rsi14} (5 bars ago ${dd.rsi14_5_bars_ago}) · MACD hist ${dd.macd.hist} (prev ${dd.macd.hist_prev})${t.session && t.session.vwap ? ` · session VWAP ${t.session.vwap}` : ''}</div>
      <div class="sub" style="margin-top:6px">Resistance</div>${lv(t.levels.resistances.slice().reverse(), 'negv')}
      <div class="sub" style="margin-top:6px">Support</div>${lv(t.levels.supports, 'pos')}
      ${t.mtf && t.mtf.summary ? `<div class="sub" style="margin-top:6px">Timeframe ladder (turn ${esc(t.mtf.summary.dir)} from ${t.mtf.summary.from_swing.price})</div>` +
        t.mtf.summary.steps.map(x => `<div class="lvl"><b>${esc(x.tf)}</b> <span class="${x.status == 'confirmed' ? 'pos' : x.status == 'pending' ? '' : 'sub'}">${esc(x.status)}${x.status == 'pending' && x.level != null ? ` · close ${t.mtf.summary.dir == 'up' ? 'above' : 'below'} ${x.level}` : x.when ? ' ' + esc(x.when) : ''}</span></div>`).join('') : ''}
      ${t.open_patterns.length ? `<div class="sub" style="margin-top:6px">Open patterns</div>` + t.open_patterns.map(p => `<div class="lvl">${esc(p.type)} <span class="sub">${esc(p.status)}${p.target ? ', target ' + p.target : ''}</span></div>`).join('') : ''}
    </div>`;
  }).join('');
  el.innerHTML = `<h2 style="margin-top:0;font-size:17px">Data snapshot <span class="sub">${esc(d.generated_et)} ET</span></h2>
    <div class="grid">${tk}</div>
    <h3 style="font-size:15px">Cross-asset</h3>
    <div class="wrap"><table><tr><th>Market</th><th></th><th>Last</th>${P.map(([, l]) => `<th>${l}</th>`).join('')}</tr>${ctx}</table></div>
    ${secs.length ? `<h3 style="font-size:15px">Sectors <span class="sub">sorted by <select id="secSort">${P.map(([k, l]) => `<option value="chg_${k}">${l}</option>`).join('')}</select> · grey = vs SPY in percentage points</span></h3>
    <div class="wrap"><table id="secTable"><tr><th>Sector</th><th>Last</th>${P.map(([, l]) => `<th>${l}</th>`).join('')}</tr>${secRows('chg_1d')}</table></div>` : ''}`;
  const ss = $('#secSort');
  if (ss) ss.onchange = () => { $('#secTable').innerHTML = `<tr><th>Sector</th><th>Last</th>${P.map(([, l]) => `<th>${l}</th>`).join('')}</tr>` + secRows(ss.value); };
}

get('index.json', 'json').catch(() => null).then(ix => {
  ix = ix || {briefs: []};
  const list = ix.briefs || [];
  if (!list.length) { $('#brief').innerHTML = '<div class="empty">No briefs yet. The first one appears after the next 9:15 or 15:45 ET run.</div>'; return; }
  $('#pick').innerHTML = list.map(b => `<option value="${esc(b.id)}">${esc(b.title || b.id)}</option>`).join('');
  const want = location.hash.slice(1);
  const id = list.some(b => b.id == want) ? want : list[0].id;
  $('#pick').value = id;
  $('#pick').onchange = () => load($('#pick').value);
  load(id);
});

// ── Macro outlook (data refreshed with each brief; outlook rewritten only after big releases / Fed events) ──
const MRAW = 'https://raw.githubusercontent.com/berkeoz/new_trading/master/macro/';
const mget = (f, kind) => fetch(MRAW + f).then(r => r.ok ? r : Promise.reject())
  .catch(() => fetch('macro/' + f)).then(r => r.ok ? r[kind]() : null).catch(() => null);
function spark(vals) {
  const v = vals.filter(x => x != null); if (v.length < 2) return '';
  const lo = Math.min(...v), hi = Math.max(...v), w = 90, h = 22;
  const pts = vals.map((x, i) => `${(i / (vals.length - 1) * w).toFixed(1)},${(h - (x - lo) / ((hi - lo) || 1) * h).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" style="vertical-align:middle"><polyline fill="none" stroke="#5c8dff" stroke-width="1.5" points="${pts}"/></svg>`;
}
const fmtv = (x, d = 2) => x == null ? '–' : (+x).toLocaleString(undefined, {maximumFractionDigits: d});
const trendCls = (t, pillar) => !t ? '' : (t == 'stable' ? 'sub' : (pillar == 'Inflation' ? (t == 'accelerating' ? 'negv' : 'pos') : ''));
async function loadMacro() {
  const el = $('#macro');
  const [d, st, ix] = await Promise.all([mget('data.json', 'json'), mget('state.json', 'json'), mget('index.json', 'json')]);
  if (!d) { el.innerHTML = '<h2>Macro outlook</h2><div class="sub">No macro data yet.</div>'; return; }
  const outs = (ix && ix.outlooks) || [];
  const regs = Object.entries(d.regimes || {}).map(([k, v]) => `<div class="reg"><b>${esc(k)}</b>${esc(v)}</div>`).join('');
  const ff = d.fed_futures;
  const ffHtml = !ff ? '' : `<h3>Fed rate expectations <span class="sub">from fed funds futures, CME FedWatch method · effective rate ${ff.effr}%${ff.target_range ? ` · target ${ff.target_range[0]}–${ff.target_range[1]}%` : ''}</span></h3>
    <div class="wrap"><table><tr><th>FOMC</th><th>Implied rate after</th><th>Change</th><th>Hike</th><th>Hold</th><th>Cut</th></tr>${ff.meetings.map(m =>
      `<tr><td>${m.date}</td><td>${m.implied_after}%</td><td>${m.change_bp > 0 ? '+' : ''}${m.change_bp} bp</td><td class="${m.p_hike >= 50 ? 'negv' : ''}">${m.p_hike}%</td><td>${m.p_hold}%</td><td class="${m.p_cut >= 50 ? 'pos' : ''}">${m.p_cut}%</td></tr>`).join('')}</table></div>
    <div class="sub">Implied average rate by month: ${ff.months.map(x => `${x.month} ${x.implied}%`).join(' · ')}. ${esc(ff.note)}</div>`;
  const tables = d.pillars.map(p => {
    const rows = d.series.filter(x => x.pillar == p).map((x, k) => `<tr class="ind" data-id="${x.id}">
        <td>${esc(x.name)}${x.tier1 ? ' <span class="pill2">headline</span>' : ''}</td>
        <td><b>${fmtv(x.value)}</b> <span class="sub">${esc(x.unit)}</span>${x.mom != null ? `<div class="sub">m/m ${x.mom > 0 ? '+' : ''}${x.mom}% · 3m ann. ${x.ann3m}%</div>` : ''}${x.avg3m != null ? `<div class="sub">3m avg ${x.avg3m > 0 ? '+' : ''}${x.avg3m}k</div>` : ''}${x.yoy != null ? `<div class="sub">${x.yoy > 0 ? '+' : ''}${x.yoy}% y/y</div>` : ''}</td>
        <td class="sub">${x.value_date.slice(0, 7)}</td><td>${fmtv(x.prev)}</td>
        <td class="${trendCls(x.trend, p)}">${esc(x.trend)}</td><td>${x.pct_rank_10y}th <div class="sub">${x.range_10y[0]}–${x.range_10y[1]}</div></td>
        <td>${spark(x.table12.map(t => t.value))}</td></tr>`).join('');
    return `<h3>${esc(p)}</h3><div class="wrap"><table class="mt"><tr><th>Indicator</th><th>Latest</th><th>For</th><th>Previous</th><th>Trend</th><th>10-year percentile</th><th>Last 12 months</th></tr>${rows}</table></div>`;
  }).join('');
  el.innerHTML = `<h2>Macro outlook</h2>
    <div class="sub">Data updated ${esc(d.generated_et)} ET with each brief; the written outlook is rewritten only after major releases (CPI, PPI, PCE, jobs, GDP, retail sales, JOLTS), Fed decisions / minutes or big policy news.</div>
    ${st && st.stale ? `<div class="pend">⏳ Update pending: ${esc((st.reasons || []).join('; '))} — the next brief run will rewrite the outlook.</div>` : ''}
    ${outs.length ? `<p><select id="outPick">${outs.map(o => `<option value="${esc(o.file)}">${esc(o.title)}</option>`).join('')}</select></p><div id="outlook"></div>` : '<div class="sub">No written outlook yet.</div>'}
    <h3>Regime by pillar</h3><div class="regs">${regs}</div>
    ${ffHtml}${tables}
    ${Object.keys(d.errors || {}).length ? `<div class="sub">Not available: ${esc(Object.keys(d.errors).join(', '))}</div>` : ''}
    <div class="sub" style="margin-top:8px">Sources: FRED (St. Louis Fed), Yahoo Finance fed funds futures. ADP payrolls, ISM PMIs and the Conference Board indexes are not freely published as data, so the written outlook covers them from the news. Click an indicator for 10 years of history. Not investment advice.</div>`;
  if (outs.length) {
    const show = async f => { const md = await mget(f, 'text'); $('#outlook').innerHTML = md ? DOMPurify.sanitize(marked.parse(md)) : '<div class="sub">Not found.</div>';
      $('#outlook').querySelectorAll('a').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; }); };
    $('#outPick').onchange = () => show($('#outPick').value);
    show(outs[0].file);
  }
  el.querySelectorAll('tr.ind').forEach(tr => tr.onclick = () => {
    const nx = tr.nextElementSibling;
    if (nx && nx.classList.contains('det')) { nx.remove(); return; }
    const x = d.series.find(s => s.id == tr.dataset.id);
    const det = document.createElement('tr'); det.className = 'det';
    det.innerHTML = `<td colspan="7"><div class="chart" id="mc_${x.id}" style="height:260px"></div>
      <div class="sub">Last 12 months: ${x.table12.map(t => `${t.date} <b>${fmtv(t.value)}</b>`).join(' · ')} · FRED series ${x.id}, latest observation ${x.latest_obs}</div></td>`;
    tr.after(det);
    Plotly.newPlot('mc_' + x.id, [{type:'scatter', mode:'lines', x:x.hist.x, y:x.hist.y, line:{color:'#5c8dff', width:1.6}, hovertemplate:'%{x}: %{y}<extra></extra>'}],
      {paper_bgcolor:'#171a21', plot_bgcolor:'#171a21', font:{color:'#e6e6e6', size:11}, margin:{l:45, r:10, t:10, b:30},
       xaxis:{gridcolor:'#2a2f3a'}, yaxis:{gridcolor:'#2a2f3a', title:{text:x.unit, font:{size:11}}}}, {responsive:true, displaylogo:false});
  });
}
loadMacro();
</script></body></html>
